<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo Cáo Chiến Dịch Trà Bí Đao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #FAF7EF;
    --bg-elevated: #FFFFFF;
    --ink: #21301F;
    --ink-soft: #5B6B57;
    --line: #DDD6C4;
    --jade: #3F6B52;
    --jade-deep: #2C4D3B;
    --jade-tint: #E7EFE6;
    --caramel: #B9793F;
    --caramel-tint: #F5E9DA;
    --good: #3F6B52;
    --bad: #B4432F;
    --bad-tint: #F7E4DE;
    --shadow: 0 1px 2px rgba(33,48,31,0.06);
    font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171D16;
      --bg-elevated: #202822;
      --ink: #EDF1EA;
      --ink-soft: #A6B2A0;
      --line: #34402F;
      --jade: #79B396;
      --jade-deep: #9BCBB0;
      --jade-tint: #223027;
      --caramel: #E0A968;
      --caramel-tint: #2E2419;
      --good: #79B396;
      --bad: #E08A73;
      --bad-tint: #33211C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171D16;
    --bg-elevated: #202822;
    --ink: #EDF1EA;
    --ink-soft: #A6B2A0;
    --line: #34402F;
    --jade: #79B396;
    --jade-deep: #9BCBB0;
    --jade-tint: #223027;
    --caramel: #E0A968;
    --caramel-tint: #2E2419;
    --good: #79B396;
    --bad: #E08A73;
    --bad-tint: #33211C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header.topbar {
    position: sticky; top: 0; z-index: 10;
    padding: env(safe-area-inset-top, 0px) 0 0 0;
    background: var(--jade-deep);
    color: #F3F1E4;
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto;
    padding: 18px 20px 0 20px;
  }
  .topbar h1 {
    margin: 0 0 2px 0; font-size: 19px; font-weight: 700; letter-spacing: 0.1px;
  }
  .topbar p.sub { margin: 0 0 14px 0; font-size: 13px; color: #C9D8CB; }
  nav.tabs {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0;
  }
  nav.tabs button {
    appearance: none; border: none; background: transparent; color: #C9D8CB;
    padding: 9px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-radius: 8px 8px 0 0; white-space: nowrap; font-family: inherit;
  }
  nav.tabs button.active { background: var(--bg); color: var(--jade-deep); }
  nav.tabs button:not(.active):hover { background: rgba(255,255,255,0.08); }

  main {
    flex: 1; width: 100%; max-width: 1180px; margin: 0 auto;
    padding: 20px 20px 60px 20px;
  }
  .status-line {
    font-size: 12px; color: var(--ink-soft); margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
  .dot.warn { background: var(--caramel); }

  h2.section-title {
    font-size: 15px; font-weight: 700; margin: 30px 0 10px 0; color: var(--ink);
  }
  h2.section-title:first-child { margin-top: 0; }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 6px;
  }
  .kpi-card {
    background: var(--bg-elevated); border-left: 3px solid var(--jade);
    border-radius: 6px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi-card .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .kpi-card .value { font-size: 21px; font-weight: 700; }
  .kpi-card.bad { border-left-color: var(--bad); }
  .kpi-card .value.bad { color: var(--bad); }
  .kpi-card .value.good { color: var(--good); }

  .card {
    background: var(--bg-elevated); border-radius: 8px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .table-scroll { overflow-x: auto; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11.5px; text-transform: none; color: var(--ink-soft); font-weight: 600; }
  tbody tr:hover { background: var(--jade-tint); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.strong { font-weight: 700; }
  .barcell { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .bar-track { flex: 1; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
  .bar-fill { height: 100%; background: var(--jade); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill.good { background: var(--jade-tint); color: var(--good); }
  .pill.bad { background: var(--bad-tint); color: var(--bad); }

  label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%;
  }
  input[type=number] { text-align: right; }
  .field { margin-bottom: 12px; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field-row > .field { flex: 1; min-width: 160px; }

  button.btn {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    font-weight: 700; font-size: 13.5px; padding: 10px 18px; border-radius: 7px;
    background: var(--jade); color: #fff;
  }
  button.btn:hover { background: var(--jade-deep); }
  button.btn.secondary { background: transparent; color: var(--jade); border: 1px solid var(--jade); }
  button.btn.secondary:hover { background: var(--jade-tint); }
  button.btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .qty-table input[type=number] { width: 78px; }
  .qty-table td, .qty-table th { text-align: center; }
  .qty-table td:first-child, .qty-table th:first-child { text-align: left; }

  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .banner {
    background: var(--caramel-tint); border: 1px solid var(--caramel); border-radius: 7px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px; color: var(--ink);
  }
  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 13.5px;
  }
  .stores-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--jade-tint); color: var(--jade-deep); font-weight: 600;
  }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .store-leaderboard { display: flex; flex-direction: column; }
  .store-row {
    display: flex; align-items: center; gap: 14px; padding: 11px 4px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .store-row:last-child { border-bottom: none; }
  .store-row:hover { background: var(--jade-tint); }
  .rank-badge {
    width: 26px; height: 26px; border-radius: 50%; background: var(--line);
    color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12.5px; flex: 0 0 auto;
  }
  .rank-badge.top { background: var(--caramel); color: #fff; }
  .store-info { flex: 1; min-width: 0; }
  .store-info .name { font-weight: 700; font-size: 14px; }
  .store-info .sub { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .store-metrics { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
  .store-metrics .share { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .store-metrics .share .bar-track { width: 60px; }
  .store-metrics .share span { font-size: 12.5px; color: var(--ink-soft); min-width: 38px; text-align: right; }
  .store-metrics .rev { font-weight: 700; font-size: 14px; min-width: 100px; text-align: right; }
  .store-detail { padding: 4px 4px 16px 40px; }
  .store-detail table { font-size: 12.5px; }

  table.daily-table th.grp { text-align: center; font-size: 11.5px; font-weight: 700; padding: 7px 10px; }
  table.daily-table th.grp-rev { background: var(--jade-tint); color: var(--jade-deep); }
  table.daily-table th.grp-qty { background: var(--caramel-tint); color: var(--caramel); }
  table.daily-table td.grp-rev-cell, table.daily-table th.grp-rev-cell { background: color-mix(in srgb, var(--jade-tint) 45%, transparent); }
  table.daily-table td.grp-qty-cell, table.daily-table th.grp-qty-cell { background: color-mix(in srgb, var(--caramel-tint) 45%, transparent); }
  table.daily-table td.col-divider, table.daily-table th.col-divider { border-left: 2px solid var(--line); }
  table.daily-table tbody tr.today-row td { background: var(--jade-tint) !important; font-weight: 600; }
  table.daily-table tbody tr.today-row td:first-child { border-left: 3px solid var(--jade); }
  table.daily-table tbody tr.future-row td { color: var(--ink-soft); opacity: 0.55; }
  .delta { font-weight:700; font-size:12.5px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat { color: var(--ink-soft); }
  .pill.neutral { background: var(--line); color: var(--ink-soft); }
  .today-badge { font-size: 10px; font-weight: 700; color: var(--jade); margin-left: 6px; }
  @media (max-width: 640px) {
    .store-metrics { gap: 10px; }
    .store-metrics .share { min-width: 90px; }
    .store-metrics .share .bar-track { width: 36px; }
    .store-metrics .rev { min-width: 80px; }
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
  code.tag { background: var(--jade-tint); color: var(--jade-deep); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============ DỮ LIỆU CẤU HÌNH CHIẾN DỊCH ============ */

var STORES = [
  {code:"PHUCTEA004", name:"Thích Quảng Đức Long Khánh"},
  {code:"PHUCTEA007", name:"Tôn Đức Thắng Long Thành"},
  {code:"PHUCTEA056", name:"Bình Tân Vĩnh Long"},
  {code:"PHUCTEA059", name:"Mỹ Phước Bến Cát"},
  {code:"PHUCTEA062", name:"Bến Lức"},
  {code:"PHUCTEA076", name:"Trị An"},
  {code:"PHUCTEA094", name:"Ninh Phước"},
  {code:"PHUCTEA099", name:"Bình Minh"},
  {code:"PHUCTEA101", name:"Vĩnh An"},
  {code:"PHUCTEA107", name:"Mỹ Phước 2 Bến Cát"},
  {code:"PHUCTEA108", name:"Ô Môn"},
  {code:"PHUCTEA111", name:"Bàu Bàng"},
  {code:"PHUCTEACENTER001", name:"Cần Thơ"},
  {code:"PHUCTEA114", name:"Mỹ Phước 3 Bến Cát"},
  {code:"PHUCTEA116", name:"An Tây"},
  {code:"PHUCTEA137", name:"Vĩnh Tân"},
  {code:"PHUCTEA143", name:"Thới Hòa Bến Cát"},
  {code:"PHUCTEA147", name:"Phú Lợi Thủ Dầu Một"},
  {code:"PHUCTEA150", name:"Chử Đồng Tử Tân Bình"},
  {code:"PHUCTEA158", name:"Đức Hòa Tây Ninh"},
  {code:"PHUCTEA045", name:"Phú Tài"},
  {code:"PHUCTEA138", name:"Trần Hoàng Na Cần Thơ"},
  {code:"PHUCTEA149", name:"Hùng Vương Đồng Xoài"},
  {code:"PHUCTEA095", name:"Cái Tắc"},
  {code:"PHUCTEA156", name:"Đinh Đức Thiện Bình Chánh"},
  {code:"PHUCTEA163", name:"Tân Ninh Tây Ninh"},
  {code:"PHUCTEA166", name:"Tân Tiến Đồng Phú"},
  {code:"PHUCTEA167", name:"Trường Thành Thới Lai"}
];
var STORE_MAP = {};
STORES.forEach(function(s){ STORE_MAP[s.code] = s.name; });

var ITEMS = [
  {id:"HATCHIA", name:"Trà Bí Đao Hạt Chia"},
  {id:"SUONGSAO", name:"Trà Bí Đao Sương Sáo"},
  {id:"TCDEN", name:"Trà Bí Đao Trân Châu Đen"},
  {id:"TCGION", name:"Trà Bí Đao Trân Châu Giòn"},
  {id:"CHANHNHADAM", name:"Trà Bí Đao Chanh Nha Đam"},
  {id:"TACNHADAM", name:"Trà Bí Đao Tắc Nha Đam"}
];
var ITEM_MAP = {};
ITEMS.forEach(function(it){ ITEM_MAP[it.id] = it.name; });

var SIZE_KEYS = ["S","M","L1L","X1L"];
var SIZE_LABELS = {S:"Size S", M:"Size M", L1L:"Ly 1L", X1L:"Xô 1L"};
var PRICE = {S:19000, M:22000, L1L:24000, X1L:27000};
var TOPPING_PRICE = 6000;
var TOPPING_LABEL = "Topping Thạch Bí Đao (thêm)";

/* ============ STATE ============ */

var state = {
  tab: "dashboard",
  db: null,
  mode: "local", // "db" hoặc "local"
  entries: {},   // docId -> {date, storeCode, items:{itemId:{S,M,L1L,X1L}}, toppingExtra}
  settings: {totalTarget: 129816000, totalQtyTarget: 4808, systemTarget: 432695209, onlineChannelPct: 30, startDate: "", endDate: ""},
  loaded: false,
  expandedStore: null,
  importRows: null,
  importSkippedZero: 0
};

var root = document.getElementById("app");

/* ============ TIỆN ÍCH ============ */

function fmtVND(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString("vi-VN") + "đ";
}
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString("vi-VN"); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function docId(date, storeCode){ return date + "_" + storeCode; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function emptyItems(){
  var o = {};
  ITEMS.forEach(function(it){ o[it.id] = {S:0,M:0,L1L:0,X1L:0}; });
  return o;
}
function emptyItemsRevenue(){
  var o = {};
  ITEMS.forEach(function(it){ o[it.id] = {S:0,M:0,L1L:0,X1L:0}; });
  return o;
}
function dateRangeArray(start, end){
  var out = [];
  if(!start || !end) return out;
  var d = new Date(start+"T00:00:00");
  var e = new Date(end+"T00:00:00");
  if(isNaN(d) || isNaN(e) || d>e) return out;
  while(d<=e){
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate()+1);
  }
  return out;
}
// Doanh thu ưu tiên lấy đúng số tiền thật đã ghi nhận (itemsRevenue, từ cột "Tổng tiền" khi nhập từ file CSKH);
// nếu dòng/ô nào không có số tiền thật (nhập tay thủ công, hoặc file không có cột Tổng tiền) thì mới tính theo bảng giá chuẩn.
function entryTotals(entry){
  var rev=0, ly=0;
  ITEMS.forEach(function(it){
    var sizes = (entry.items && entry.items[it.id]) || {};
    var revSizes = (entry.itemsRevenue && entry.itemsRevenue[it.id]) || {};
    SIZE_KEYS.forEach(function(sk){
      var q = Number(sizes[sk]||0);
      ly += q;
      rev += (revSizes[sk]!=null ? Number(revSizes[sk]) : q*PRICE[sk]);
    });
  });
  var topQ = Number(entry.toppingExtra||0);
  rev += (entry.toppingRevenue!=null ? Number(entry.toppingRevenue) : topQ*TOPPING_PRICE);
  return {rev:rev, ly:ly, toppingQty:topQ};
}


/* ============ KHỞI TẠO STORAGE (db capability hoặc localStorage) ============ */

var LOCAL_KEY = "bidao_campaign_v1";

var DEFAULT_SETTINGS = {totalTarget: 129816000, totalQtyTarget: 4808, systemTarget: 432695209, onlineChannelPct: 30, startDate: "", endDate: ""};

function loadLocal(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.entries = parsed.entries || {};
      state.settings = parsed.settings || Object.assign({}, DEFAULT_SETTINGS);
    }
  }catch(e){ /* bỏ qua, giữ mặc định */ }
  state.loaded = true;
  render();
}
function saveLocal(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify({entries:state.entries, settings:state.settings}));
  }catch(e){ /* im lặng nếu storage đầy/không khả dụng */ }
}

async function initStorage(){
  var db = null;
  try{
    if(window.claude && typeof window.claude.use === "function"){
      db = await window.claude.use("db");
    }
  }catch(e){ db = null; }

  if(db){
    state.db = db;
    state.mode = "db";
    try{
      var settingsSnap = await db.doc("settings/campaign").get();
      if(settingsSnap.exists){
        state.settings = Object.assign({}, DEFAULT_SETTINGS, settingsSnap.data());
      }
    }catch(e){}

    db.doc("settings/campaign").onSnapshot(function(snap){
      if(snap.exists){
        state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.data());
        if(state.tab === "dashboard" || state.tab === "settings") render();
      }
    }, function(err){ console.error("settings snapshot error", err); });

    db.collection("entries").onSnapshot(function(qsnap){
      var map = {};
      qsnap.docs.forEach(function(d){
        if(d.exists) map[d.id] = d.data();
      });
      state.entries = map;
      state.loaded = true;
      if(state.tab === "dashboard"){
        render();
      } else {
        updateEnteredStoresChip();
      }
    }, function(err){ console.error("entries snapshot error", err); });

    state.loaded = true;
    render();
  } else {
    state.mode = "local";
    loadLocal();
  }
}

async function persistEntry(entryData){
  var id = docId(entryData.date, entryData.storeCode);
  state.entries[id] = entryData;
  if(state.mode === "db" && state.db){
    await state.db.collection("entries").doc(id).set(entryData);
  } else {
    saveLocal();
  }
}

async function persistSettings(newSettings){
  state.settings = newSettings;
  if(state.mode === "db" && state.db){
    await state.db.doc("settings/campaign").set(newSettings);
  } else {
    saveLocal();
  }
}

async function getExistingEntry(date, storeCode){
  var id = docId(date, storeCode);
  if(state.mode === "db" && state.db){
    try{
      var snap = await state.db.collection("entries").doc(id).get();
      if(snap.exists) return snap.data();
    }catch(e){}
    return null;
  } else {
    return state.entries[id] || null;
  }
}

/* ============ TỔNG HỢP SỐ LIỆU ============ */

function allEntriesArray(){
  return Object.keys(state.entries).map(function(k){ return state.entries[k]; });
}
function entriesInRange(start,end){
  return allEntriesArray().filter(function(e){
    if(!start || !end) return true;
    return e.date >= start && e.date <= end;
  });
}
function aggregateByDay(entries){
  var m = {};
  entries.forEach(function(e){
    var t = entryTotals(e);
    if(!m[e.date]) m[e.date] = {rev:0, ly:0};
    m[e.date].rev += t.rev;
    m[e.date].ly += t.ly;
  });
  return m;
}
function aggregateByStore(entries){
  var m = {};
  entries.forEach(function(e){
    var t = entryTotals(e);
    if(!m[e.storeCode]) m[e.storeCode] = {rev:0, ly:0};
    m[e.storeCode].rev += t.rev;
    m[e.storeCode].ly += t.ly;
  });
  return m;
}
function aggregateByItem(entries){
  var m = {};
  ITEMS.forEach(function(it){ m[it.id] = {S:0,M:0,L1L:0,X1L:0, rev:0}; });
  var topping = {qty:0, rev:0};
  entries.forEach(function(e){
    ITEMS.forEach(function(it){
      var sizes = (e.items && e.items[it.id]) || {};
      var revSizes = (e.itemsRevenue && e.itemsRevenue[it.id]) || {};
      SIZE_KEYS.forEach(function(sk){
        var q = Number(sizes[sk]||0);
        m[it.id][sk] += q;
        m[it.id].rev += (revSizes[sk]!=null ? Number(revSizes[sk]) : q*PRICE[sk]);
      });
    });
    var topQ = Number(e.toppingExtra||0);
    topping.qty += topQ;
    topping.rev += (e.toppingRevenue!=null ? Number(e.toppingRevenue) : topQ*TOPPING_PRICE);
  });
  return {items:m, topping:topping};
}

function renderStoreLeaderboard(entries){
  var byStore = aggregateByStore(entries);
  var totalRevAll = 0;
  STORES.forEach(function(s){ totalRevAll += (byStore[s.code] ? byStore[s.code].rev : 0); });
  var rows = STORES.map(function(s){
    var d = byStore[s.code] || {rev:0, ly:0};
    return {code:s.code, name:s.name, rev:d.rev, ly:d.ly};
  }).sort(function(a,b){ return b.rev - a.rev; });
  var maxRev = rows.length ? (rows[0].rev || 1) : 1;

  var html = '<div class="store-leaderboard">';
  rows.forEach(function(r, idx){
    var rank = idx+1;
    var share = totalRevAll>0 ? (r.rev/totalRevAll*100) : 0;
    var barWidth = maxRev>0 ? Math.max(r.rev>0?2:0, Math.round(r.rev/maxRev*100)) : 0;
    var expanded = state.expandedStore === r.code;
    html += '<div class="store-row" data-store="'+r.code+'">';
    html += '<div class="rank-badge'+(rank<=3?' top':'')+'">'+rank+'</div>';
    html += '<div class="store-info"><div class="name">'+esc(r.name)+'</div><div class="sub">'+esc(r.code)+' · '+fmtNum(r.ly)+' ly</div></div>';
    html += '<div class="store-metrics">';
    html += '<div class="share"><div class="bar-track"><div class="bar-fill" style="width:'+barWidth+'%"></div></div><span>'+share.toFixed(1)+'%</span></div>';
    html += '<div class="rev">'+fmtVND(r.rev)+'</div>';
    html += '</div></div>';
    if(expanded){
      html += renderStoreDetailRow(r.code, entries);
    }
  });
  html += '</div>';
  if(rows.every(function(r){return r.rev===0;})){
    html = '<div class="empty-state">Chưa có dữ liệu doanh thu cửa hàng nào trong khoảng thời gian này.</div>';
  }
  return html;
}

function renderStoreDetailRow(code, entries){
  var filtered = entries.filter(function(e){ return e.storeCode===code; });
  var agg = aggregateByItem(filtered);
  var rows = ITEMS.map(function(it){
    var d = agg.items[it.id];
    var totalQty = SIZE_KEYS.reduce(function(a,k){ return a + d[k]; }, 0);
    return {name: it.name, qty: totalQty, rev: d.rev};
  }).sort(function(a,b){ return b.rev - a.rev; });
  var out = '<div class="store-detail table-scroll"><table><thead><tr><th>Món</th><th class="num">Số ly</th><th class="num">Doanh thu</th></tr></thead><tbody>';
  rows.forEach(function(r){
    out += '<tr><td>'+esc(r.name)+'</td><td class="num">'+fmtNum(r.qty)+'</td><td class="num">'+fmtVND(r.rev)+'</td></tr>';
  });
  if(agg.topping.qty>0){
    out += '<tr><td>'+esc(TOPPING_LABEL)+'</td><td class="num">'+fmtNum(agg.topping.qty)+' phần</td><td class="num">'+fmtVND(agg.topping.rev)+'</td></tr>';
  }
  out += '</tbody></table></div>';
  return out;
}

// Tăng/giảm % so với ngày liền trước (▲ xanh = tăng, ▼ đỏ = giảm)
function deltaCell(cur, prev){
  if(prev==null) return '<span class="hint">—</span>';
  if(!(prev>0)) return cur>0 ? '<span class="delta up">▲ mới</span>' : '<span class="hint">—</span>';
  var pct = (cur-prev)/prev*100;
  if(Math.abs(pct) < 0.05) return '<span class="delta flat">0%</span>';
  var up = pct>0;
  return '<span class="delta '+(up?'up':'down')+'">'+(up?'▲ +':'▼ ')+pct.toFixed(1)+'%</span>';
}

function kpiCard(label, value, cls){
  cls = cls || "";
  return '<div class="kpi-card '+(cls==="bad"?"bad":"")+'"><div class="label">'+esc(label)+'</div><div class="value '+cls+'">'+value+'</div></div>';
}
function fmtDateVN(d){
  var parts = d.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}

async function loadEntryIntoForm(){
  var date = document.getElementById("de-date").value;

  var tbody = document.getElementById("de-tbody");
  if(!tbody) return;

  ITEMS.forEach(function(it){

function updateDataEntryPreview(){
  var tbody = document.getElementById("de-tbody");

  ITEMS.forEach(function(it){
    SIZE_KEYS.forEach(function(sk){
      var input = tbody.querySelector('input[data-item="'+it.id+'"][data-size="'+sk+'"]');

async function saveDataEntryForm(){
  var date = document.getElementById("de-date").value;
  var storeCode = document.getElementById("de-store").value;
  if(!date){ alert("Vui lòng chọn ngày."); return; }
  var tbody = document.getElementById("de-tbody");
  var items = emptyItems();
  ITEMS.forEach(function(it){
    SIZE_KEYS.forEach(function(sk){
      var input = tbody.querySelector('input[data-item="'+it.id+'"][data-size="'+sk+'"]');
      items[it.id][sk] = Math.max(0, Number((input && input.value) || 0));
    });
  });
  var topping = Math.max(0, Number((document.getElementById("de-topping")||{}).value || 0));
  var entryData = {
    date: date, storeCode: storeCode, storeName: STORE_MAP[storeCode] || storeCode,
    items: items, toppingExtra: topping, updatedAt: Date.now()
  };
  var msgEl = document.getElementById("de-save-msg");
  try{
    if(msgEl) msgEl.textContent = "Đang lưu…";

    if(msgEl) msgEl.textContent = "Đã lưu lúc " + new Date().toLocaleTimeString("vi-VN");

    console.error(e);
    if(msgEl) msgEl.textContent = "Lỗi khi lưu: " + (e && e.message ? e.message : "không rõ nguyên nhân");

}

function convertDateToISO(raw){
  raw = (raw||"").trim();
  var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    var dd = m[1].length<2 ? "0"+m[1] : m[1];
    var mm = m[2].length<2 ? "0"+m[2] : m[2];
    return m[3]+"-"+mm+"-"+dd;
  }
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  return null;
}

function preprocessRawCSV(text){
  var lines = text.split(/\r\n|\n|\r/);
  var headerIdx = 0;
  for(var i=0;i<Math.min(lines.length,6);i++){
    var low = lines[i].toLowerCase();
    var looksLikeHeader = low.indexOf("tên món")>-1 || low.indexOf("mamon")>-1 ||
      (low.indexOf("số lượng")>-1 && low.indexOf("đơn vị tính")>-1);
    if(looksLikeHeader){ headerIdx = i; break; }
  }
  return lines.slice(headerIdx).join("\n");
}

function parseCSV(rawText){
  var text = preprocessRawCSV(rawText);
  var result = Papa.parse(text, {
    header: true, skipEmptyLines: true,
    transformHeader: function(h){ return (h||"").trim(); }
  });
  var fields = (result.meta && result.meta.fields) || [];
  var isRealExport = fields.indexOf("Tên món") > -1 || fields.indexOf("Cửa hàng") > -1;
  return isRealExport ? parseRealExportRows(result.data||[]) : parseTemplateRows(result.data||[]);
}

function parseMoneyVN(raw){
  // "24,000" hoặc "0,000" -> 24000 / 0 (dấu phẩy là phân cách nghìn trong file xuất)
  var s = (raw||"").toString().trim();
  if(s==="") return NaN;
  s = s.replace(/[^\d.,-]/g,"").replace(/,/g,"");
  return Number(s);
}

// Định dạng file thật xuất từ hệ thống CSKH: NGÀY, Cửa hàng, Số điện thoại, Tên món, Số lượng, Đơn vị tính, Tổng tiền, Ghi chú món
function parseRealExportRows(data){
  var rows = [];
  var skippedZero = 0;
  data.forEach(function(r, idx){
    var line = idx+2;
    var dateRaw = (r["NGÀY"]||"").trim();
    var storeRaw = (r["Cửa hàng"]||"").trim();
    var monRaw = (r["Tên món"]||"").trim();
    var qtyRaw = (r["Số lượng"]||"").toString().trim();
    var dvt = (r["Đơn vị tính"]||"").trim().toLowerCase();
    var tongTienRaw = r["Tổng tiền"];

    if(!dateRaw && !storeRaw && !monRaw) return; // bỏ qua dòng trắng

    // Bỏ hẳn các dòng có Tổng tiền = 0 (dòng ghi log trùng, không tính là đơn bán thật)
    var tongTien = parseMoneyVN(tongTienRaw);
    if(!isNaN(tongTien) && tongTien === 0){ skippedZero++; return; }

    var rowErrors = [];
    var date = convertDateToISO(dateRaw);
    if(!date) rowErrors.push("ngày không đọc được (\""+dateRaw+"\")");

    var storeCode = storeRaw.split(" - ")[0].trim();
    if(!STORE_MAP[storeCode]) rowErrors.push("mã cửa hàng không tồn tại (\""+storeRaw+"\")");

    // Chuẩn hoá tên món: bỏ phần dịch tiếng Trung sau dấu "/" (VD "... (Size 1L)/ 奇亞籽冬瓜茶（桶裝1L）"),
    // đổi ngoặc full-width thành ngoặc thường, rồi mới tách tên gốc + size trong ngoặc.
    var monClean = monRaw.split("/")[0].replace(/（/g,"(").replace(/）/g,")").trim();
    var sufM = monClean.match(/\(([^)]*)\)/);
    var suffix = sufM ? sufM[1].trim().toLowerCase() : "";
    var baseName = monClean.replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();
    var itemId = ITEM_NAME_TO_ID[baseName.toLowerCase()];
    if(!itemId){
      // dự phòng: khớp theo tiền tố tên món chuẩn (phòng khi có ký tự/ghi chú lạ phía sau)
      var lowerClean = monClean.toLowerCase();
      ITEMS.forEach(function(it){
        if(!itemId && lowerClean.indexOf(it.name.toLowerCase())===0) itemId = it.id;
      });
    }
    if(!itemId) rowErrors.push("không nhận diện được tên món (\""+monRaw+"\")");

    var size = null;
    if(suffix === ""){
      size = "S";
    } else if(suffix.indexOf("size m")>-1 || suffix === "m"){
      size = "M";
    } else if(suffix.indexOf("1l")>-1){
      size = (dvt.indexOf("xô")>-1 || dvt.indexOf("xo")>-1) ? "X1L" : "L1L";
    } else {
      rowErrors.push("không nhận diện được size (\""+suffix+"\")");
    }

    var qty = Number(qtyRaw.replace(",", "."));
    if(isNaN(qty) || qty<0) rowErrors.push("số lượng không hợp lệ (\""+qtyRaw+"\")");

    rows.push({line:line, date:date||dateRaw, store:storeCode||storeRaw, mon:itemId||baseName, size:size||"?", qty:qty, amount: isNaN(tongTien) ? undefined : tongTien, errors:rowErrors});
  });
  return {rows:rows, skippedZero:skippedZero};
}

// Định dạng rút gọn: Ngay, MaCH, MaMon, Size, SoLuong
function parseTemplateRows(data){
  var rows = [];
  var validItems = ITEMS.map(function(it){return it.id;}).concat(["TOPPING"]);
  var validSizes = SIZE_KEYS.concat(["PHAN"]);
  data.forEach(function(r, idx){
    var date = (r.Ngay||"").trim();
    var store = (r.MaCH||"").trim();
    var mon = (r.MaMon||"").trim().toUpperCase();
    var size = (r.Size||"").trim().toUpperCase();
    var qty = Number(r.SoLuong);
    var rowErrors = [];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) rowErrors.push("ngày không đúng định dạng YYYY-MM-DD");
    if(!STORE_MAP[store]) rowErrors.push("mã cửa hàng không tồn tại");
    if(validItems.indexOf(mon)===-1) rowErrors.push("mã món không hợp lệ");
    if(validSizes.indexOf(size)===-1) rowErrors.push("size không hợp lệ");
    if(isNaN(qty) || qty<0) rowErrors.push("số lượng không hợp lệ");
    rows.push({line: idx+2, date:date, store:store, mon:mon, size:size, qty:qty, errors: rowErrors});
  });
  return {rows:rows, skippedZero:0};
}

async function commitImport(){
  var rows = (state.importRows||[]).filter(function(r){ return r.errors.length===0; });
  var msgEl = document.getElementById("import-msg");
  if(rows.length===0) return;
  if(msgEl) msgEl.textContent = "Đang nhập dữ liệu…";

  // Gom nhóm theo (ngày, cửa hàng); TÍNH LẠI TOÀN BỘ từ nội dung file (không cộng dồn với dữ liệu cũ đã lưu
  // cho đúng ngày-cửa hàng đó), để tránh nhân đôi số liệu khi nhập lại file đã sửa hoặc nhập lại file cũ.
  // Doanh thu lấy đúng theo cột "Tổng tiền" thật của từng dòng; dòng nào không có số tiền (file không có cột này)
  // mới tạm tính theo bảng giá chuẩn.
  var groups = {};
  rows.forEach(function(r){
    var id = docId(r.date, r.store);
    if(!groups[id]) groups[id] = {date:r.date, storeCode:r.store, items: emptyItems(), itemsRevenue: emptyItemsRevenue(), toppingExtra: 0, toppingRevenue: 0};
    var rowAmount = (r.amount!=null && !isNaN(r.amount)) ? Number(r.amount) : null;
    if(r.mon === "TOPPING"){
      groups[id].toppingExtra += r.qty;
      groups[id].toppingRevenue += (rowAmount!=null ? rowAmount : r.qty*TOPPING_PRICE);
    } else {
      if(!groups[id].items[r.mon]) groups[id].items[r.mon] = {S:0,M:0,L1L:0,X1L:0};
      if(!groups[id].itemsRevenue[r.mon]) groups[id].itemsRevenue[r.mon] = {S:0,M:0,L1L:0,X1L:0};
      groups[id].items[r.mon][r.size] = (groups[id].items[r.mon][r.size]||0) + r.qty;
      groups[id].itemsRevenue[r.mon][r.size] = (groups[id].itemsRevenue[r.mon][r.size]||0) + (rowAmount!=null ? rowAmount : r.qty*(PRICE[r.size]||0));
    }
  });

  var keys = Object.keys(groups);
  var done = 0;
  for(var i=0;i<keys.length;i++){
    var g = groups[keys[i]];
    var entryData = {
      date: g.date, storeCode: g.storeCode, storeName: STORE_MAP[g.storeCode] || g.storeCode,
      items: g.items, itemsRevenue: g.itemsRevenue, toppingExtra: g.toppingExtra, toppingRevenue: g.toppingRevenue, updatedAt: Date.now()
    };
    try{
      await persistEntry(entryData);
      done++;
      if(msgEl) msgEl.textContent = "Đang nhập… ("+done+"/"+keys.length+" cửa hàng-ngày)";
    }catch(e){
      console.error(e);
      if(msgEl) msgEl.textContent = "Dừng lại do lỗi: " + (e && e.message ? e.message : "không rõ nguyên nhân");
      return;
    }
  }
  if(msgEl) msgEl.textContent = "Đã nhập xong "+rows.length+" dòng vào "+keys.length+" cửa hàng-ngày.";
  state.importRows = null;
}

function buildExportCSV(){
  var s = state.settings;
  var hasRange = s.startDate && s.endDate;
  var entries = hasRange ? entriesInRange(s.startDate, s.endDate) : allEntriesArray();
  var lines = [];
  lines.push("BAO CAO CHIEN DICH TRA BI DAO");
  lines.push("Tong muc tieu doanh thu," + (s.totalTarget||0));
  lines.push("Tong muc tieu so luong (ly)," + (s.totalQtyTarget||0));
  lines.push("Tu ngay," + (s.startDate||"") + ",Den ngay," + (s.endDate||""));
  lines.push("");
  lines.push("Ngay,Muc tieu DT ngay,Doanh thu,Ty le dat DT (%),Tang/giam DT so voi hom truoc (%),Muc tieu SL ngay,So ly,Ty le dat SL (%),Tang/giam SL so voi hom truoc (%)");
  var days = hasRange ? dateRangeArray(s.startDate, s.endDate) : [];
  var dailyTarget = (hasRange && days.length>0) ? (Number(s.totalTarget||0)/days.length) : 0;
  var dailyQtyTarget = (hasRange && days.length>0) ? (Number(s.totalQtyTarget||0)/days.length) : 0;
  var byDay = aggregateByDay(entries);
  var prevX = null;
  days.forEach(function(d){
    var rec = byDay[d] || {rev:0, ly:0};
    var p = dailyTarget>0 ? (rec.rev/dailyTarget*100) : 0;
    var pQty = dailyQtyTarget>0 ? (rec.ly/dailyQtyTarget*100) : 0;
    var cR = (prevX && prevX.rev>0) ? ((rec.rev-prevX.rev)/prevX.rev*100).toFixed(1) : "";
    var cQ = (prevX && prevX.ly>0) ? ((rec.ly-prevX.ly)/prevX.ly*100).toFixed(1) : "";
    lines.push([d, dailyTarget.toFixed(0), rec.rev.toFixed(0), p.toFixed(1), cR, dailyQtyTarget.toFixed(0), rec.ly, pQty.toFixed(1), cQ].join(","));
    prevX = rec;
  });
  lines.push("");
  lines.push("Ma CH,Ten CH,So ly,Doanh thu");
  var byStore = aggregateByStore(entries);
  Object.keys(byStore).sort(function(a,b){return byStore[b].rev-byStore[a].rev;}).forEach(function(code){
    lines.push([code, '"'+(STORE_MAP[code]||code)+'"', byStore[code].ly, byStore[code].rev.toFixed(0)].join(","));
  });
  lines.push("");
  lines.push("Mon,Size S,Size M,Ly 1L,Xo 1L,Tong ly,Doanh thu");
  var agg = aggregateByItem(entries);
  ITEMS.forEach(function(it){
    var d = agg.items[it.id];
    var total = SIZE_KEYS.reduce(function(a,k){return a+d[k];},0);
    lines.push(['"'+it.name+'"', d.S, d.M, d.L1L, d.X1L, total, d.rev.toFixed(0)].join(","));
  });
  lines.push(['"'+TOPPING_LABEL+'"', "-", "-", "-", "-", agg.topping.qty, agg.topping.rev.toFixed(0)].join(","));
  return lines.join("\n");
}

async function exportReport(){
  var csv = buildExportCSV();
  try{
    var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(downloads){
      await downloads.save({filename: "bao_cao_tra_bi_dao_"+todayStr()+".csv", data: csv});
      return;
    }
  }catch(e){ console.error(e); }
  // fallback: mở tab mới chứa nội dung để người dùng tự copy nếu không có quyền tải file
  var w = window.open("", "_blank");
  if(w){ w.document.write("<pre>"+csv.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre>"); }
}

async function downloadTemplate(){
  var csv = csvTemplateText();
  try{
    var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(downloads){
      await downloads.save({filename: "mau_nhap_lieu.csv", data: csv});
      return;
    }
  }catch(e){ console.error(e); }
  var w = window.open("", "_blank");
  if(w){ w.document.write("<pre>"+csv+"</pre>"); }
}

/* ============ GẮN SỰ KIỆN ============ */

function bindEvents(){
  var tabButtons = root.querySelectorAll("nav.tabs button");
  tabButtons.forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.getAttribute("data-tab")); });
  });

  if(state.tab === "dashboard"){
    var expBtn = document.getElementById("btn-export");
    if(expBtn) expBtn.addEventListener("click", exportReport);
    var storeRows = root.querySelectorAll(".store-row");
    storeRows.forEach(function(rowEl){
      rowEl.addEventListener("click", function(){
        var code = rowEl.getAttribute("data-store");
        state.expandedStore = (state.expandedStore === code) ? null : code;
        render();
      });
    });
  }

  if(state.tab === "dataentry"){
    var dateEl = document.getElementById("de-date");
    var storeEl = document.getElementById("de-store");
    if(dateEl) dateEl.addEventListener("change", loadEntryIntoForm);
    if(storeEl) storeEl.addEventListener("change", loadEntryIntoForm);
    var tbody = document.getElementById("de-tbody");
    if(tbody) tbody.addEventListener("input", updateDataEntryPreview);
    var topInput = document.getElementById("de-topping");
    if(topInput) topInput.addEventListener("input", updateDataEntryPreview);
    var saveBtn = document.getElementById("de-save");
    if(saveBtn) saveBtn.addEventListener("click", saveDataEntryForm);
    loadEntryIntoForm();
  }

  if(state.tab === "import"){
    var tmplBtn = document.getElementById("btn-template");
    if(tmplBtn) tmplBtn.addEventListener("click", downloadTemplate);
    var fileInput = document.getElementById("import-file");
    if(fileInput){
      fileInput.addEventListener("change", function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          var parsed = parseCSV(e.target.result);
          state.importRows = parsed.rows;
          state.importSkippedZero = parsed.skippedZero || 0;
          renderImportPreview();
        };
        reader.readAsText(file, "UTF-8");
      });
    }
  }

  if(state.tab === "settings"){
    var startEl = document.getElementById("set-start");
    var endEl = document.getElementById("set-end");
    var targetEl = document.getElementById("set-target");
    var qtyTargetEl = document.getElementById("set-qty-target");
    function refreshPreview(){
      var t = Number(targetEl.value||0);
      var q = Number(qtyTargetEl.value||0);
      var st = startEl.value, en = endEl.value;
      var days = (st && en) ? dateRangeArray(st,en).length : 0;
      var el = document.getElementById("set-preview");
      if(el) el.textContent = days>0 ? ("Chiến dịch "+days+" ngày — mục tiêu/ngày: "+fmtVND(t/days)+", "+fmtNum(q/days)+" ly/ngày") : "Nhập đủ ngày bắt đầu/kết thúc để hệ thống tự chia mục tiêu theo ngày.";
    }
    if(startEl) startEl.addEventListener("change", refreshPreview);
    if(endEl) endEl.addEventListener("change", refreshPreview);
    if(targetEl) targetEl.addEventListener("input", refreshPreview);
    if(qtyTargetEl) qtyTargetEl.addEventListener("input", refreshPreview);
    var saveBtn = document.getElementById("set-save");
    if(saveBtn) saveBtn.addEventListener("click", saveSettingsForm);

    var sysTargetEl = document.getElementById("set-system-target");
    var onlinePctEl = document.getElementById("set-online-pct");
    if(sysTargetEl) sysTargetEl.addEventListener("input", refreshSystemTargetPreview);
    if(onlinePctEl) onlinePctEl.addEventListener("input", refreshSystemTargetPreview);
    refreshSystemTargetPreview();
    var applyBtn = document.getElementById("set-apply-online");
    if(applyBtn) applyBtn.addEventListener("click", function(){
      var sysT = Number(sysTargetEl.value||0);
      var pct = Number(onlinePctEl.value||0);
      targetEl.value = Math.round(sysT*pct/100);
      refreshPreview();
    });
  }
}

/* ============ KHỞI CHẠY ============ */

render();
initStorage();

})();
</script>
